workers_dev = true

# KV Namespace for caching
[[kv_namespaces]]
binding = "CACHE"
id = "08f3e6b248074fdbb6cf9e31352f4be4"

# Environment variables
[vars]
GEMINI_API_ENDPOINT = "https://generativelanguage.googleapis.com/v1beta"
ENVIRONMENT = "development"

